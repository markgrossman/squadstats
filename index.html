<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Squad Stats</title>
<meta name="description" content="Fortnite squad leaderboard: wins, kills, K/D, daily records and streaks, updated automatically.">
<meta name="theme-color" content="#b8cfc3">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Squad Stats">
<meta property="og:title" content="Squad Stats">
<meta property="og:description" content="Fortnite squad leaderboard: wins, kills, K/D, daily records and streaks, updated automatically.">
<meta property="og:url" content="https://squadstats.net/">
<meta property="og:image" content="https://squadstats.net/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Squad Stats leaderboard">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#b8cfc3; --ink:#161616; --white:#fff;
    --coral:#f6806a; --yellow:#f7c948; --purple:#7470f4; --sky:#5fc9e8; --pink:#f58fc2;
    --display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.4 system-ui,sans-serif; -webkit-text-size-adjust:100%; }
  main { max-width:680px; margin:0 auto; padding:28px max(16px, env(safe-area-inset-right)) 56px max(16px, env(safe-area-inset-left)); }
  h1 { margin:0; font:800 3.4rem/.9 var(--display); text-transform:uppercase; letter-spacing:-.01em; }
  .subs { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 22px; }
  .subs .sub { margin:0; }
  .sub { display:inline-block; margin:12px 0 22px; padding:3px 12px; background:var(--white); border-radius:999px; font-size:.78rem; font-weight:600; }

  .controls { display:flex; flex-direction:column; gap:10px; margin-bottom:20px; }
  .seg { display:flex; background:var(--white); border-radius:999px; padding:4px; gap:4px; }
  .seg button { flex:1; background:none; border:0; border-radius:999px; color:var(--ink); min-height:42px; padding:0 10px; font:700 1rem var(--display); text-transform:uppercase; letter-spacing:.03em; cursor:pointer; }
  .seg button.on { background:var(--ink); color:var(--white); }
  .sortrow { display:flex; align-items:center; gap:8px; overflow-x:auto; scrollbar-width:none; margin:0 -16px; padding:0 16px; }
  .sortrow::-webkit-scrollbar { display:none; }
  .sortrow span { flex:none; font:700 .95rem var(--display); text-transform:uppercase; letter-spacing:.05em; }
  .chip { flex:none; background:var(--white); color:var(--ink); border:0; border-radius:999px; min-height:38px; padding:0 16px; font:700 1rem var(--display); text-transform:uppercase; letter-spacing:.03em; cursor:pointer; }
  .chip.on { background:var(--ink); color:var(--white); }

  .list { display:flex; flex-direction:column; gap:12px; }
  .player { --bg-c:var(--ink); --fg:var(--white); --tile:rgba(255,255,255,.1); --track:rgba(255,255,255,.18); --fill:var(--yellow); --badge:rgba(255,255,255,.14);
            background:var(--bg-c); color:var(--fg); border-radius:28px; padding:18px; }
  .player.c0 { --bg-c:var(--coral); --fg:var(--ink); --tile:rgba(255,255,255,.35); --track:rgba(0,0,0,.14); --fill:var(--ink); --badge:rgba(255,255,255,.4); }
  .player.c1 { --bg-c:var(--yellow); --fg:var(--ink); --tile:rgba(255,255,255,.4); --track:rgba(0,0,0,.14); --fill:var(--ink); --badge:rgba(255,255,255,.45); }
  .player.c2 { --bg-c:var(--purple); --fg:var(--white); --tile:rgba(255,255,255,.18); --track:rgba(255,255,255,.25); --fill:var(--white); --badge:rgba(255,255,255,.2); }
  .player.c3 { --bg-c:var(--sky); --fg:var(--ink); --tile:rgba(255,255,255,.4); --track:rgba(0,0,0,.14); --fill:var(--ink); --badge:rgba(255,255,255,.45); }
  .player.c4 { --bg-c:var(--pink); --fg:var(--ink); --tile:rgba(255,255,255,.4); --track:rgba(0,0,0,.14); --fill:var(--ink); --badge:rgba(255,255,255,.45); }
  .head { display:flex; align-items:center; gap:10px; }
  .rank { flex:none; width:36px; height:36px; border-radius:50%; display:grid; place-items:center; font:800 1.4rem var(--display); background:var(--fg); color:var(--bg-c); }
  .who { flex:1; min-width:0; }
  .name { font:800 1.4rem/1 var(--display); text-transform:uppercase; overflow-wrap:anywhere; }
  .meta { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .badge { background:var(--badge); border-radius:999px; padding:1px 10px; font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  .badge.err { background:var(--ink); color:var(--white); }
  .hero { flex:none; text-align:right; }
  .hero b { display:block; font:800 2.4rem/.85 var(--display); font-variant-numeric:tabular-nums; }
  .hero small { font:700 .85rem var(--display); text-transform:uppercase; letter-spacing:.06em; opacity:.75; }
  .bar { height:8px; background:var(--track); border-radius:4px; margin:16px 0; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--fill); border-radius:4px; }
  .tiles { display:grid; grid-template-columns:repeat(6, 1fr); gap:8px; }
  .tile { grid-column:span 2; }
  .tile:nth-child(n+4) { grid-column:span 3; }
  .tiles.n4 .tile, .tiles.n4 .tile:nth-child(n+4) { grid-column:span 3; }
  .tile { background:var(--tile); border-radius:16px; padding:10px 4px 8px; text-align:center; }
  .tile b { display:block; font:800 1.55rem/1.05 var(--display); font-variant-numeric:tabular-nums; }
  .tile small { font:700 .8rem var(--display); text-transform:uppercase; letter-spacing:.06em; opacity:.75; }
  .empty { padding:32px; text-align:center; font-weight:600; }
  .player.idle { display:flex; align-items:center; gap:10px; padding:10px 16px; border-radius:20px; opacity:.8; }
  .player.idle .name { font-size:1.2rem; }
  .player.idle .badge { flex:none; }
  .idle-msg { margin-left:auto; text-align:right; font:700 .85rem var(--display); text-transform:uppercase; letter-spacing:.05em; opacity:.8; }

  #tip { position:fixed; z-index:10; max-width:240px; padding:6px 10px; background:var(--ink); color:var(--white); border-radius:10px; font:700 .85rem/1.25 var(--display); letter-spacing:.03em; pointer-events:none; box-shadow:0 2px 10px rgba(0,0,0,.3); }
  [data-tip] { cursor:help; -webkit-tap-highlight-color:transparent; }
  .goal-pace::before { content:''; position:absolute; inset:-4px -10px; }

  .rec { display:flex; align-items:center; gap:14px; padding:9px 0; }
  .rec + .rec { border-top:1px solid rgba(0,0,0,.1); }
  .rec-v { flex:none; min-width:64px; font:800 2.2rem/.9 var(--display); font-variant-numeric:tabular-nums; }
  .rec-l { min-width:0; }
  .rec-l b { display:block; font:800 1.05rem/1.1 var(--display); text-transform:uppercase; }
  .rec-l span { display:flex; flex-wrap:wrap; align-items:center; gap:2px 6px; margin-top:2px; font:700 .85rem var(--display); text-transform:uppercase; letter-spacing:.04em; opacity:.75; }
  .dot { flex:none; width:10px; height:10px; border-radius:50%; border:1.5px solid var(--ink); }
  .badge.live { background:var(--ink); color:var(--white); font-size:.65rem; padding:0 8px; }
  .viz h3 { margin:14px 0 6px; font:700 .8rem var(--display); text-transform:uppercase; letter-spacing:.06em; opacity:.65; }
  .rolls { display:flex; flex-wrap:wrap; gap:6px; }
  .rolls .badge { display:inline-flex; align-items:center; gap:6px; background:rgba(0,0,0,.08); padding:3px 11px; font-size:.75rem; }
  .viz .fine { margin:10px 0 0; font-size:.78rem; opacity:.6; }
  .scatter text, .box text { pointer-events:none; }

  .summary { background:var(--white); border-radius:28px; padding:16px 18px; margin-bottom:12px; }
  .summary h2 { margin:0 0 8px; font:700 .9rem var(--display); text-transform:uppercase; letter-spacing:.06em; }
  .goal + .goal { margin-top:14px; }
  .goal-top { display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .goal-top b { font:800 1.05rem var(--display); text-transform:uppercase; }
  .goal-top span { font:800 1.5rem/1 var(--display); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .goal-track { position:relative; margin:8px 0 6px; }
  .goal-track .goal-bar { margin:0; }
  .goal-pace { position:absolute; top:-4px; bottom:-4px; width:3px; margin-left:-1.5px; background:var(--ink); border-radius:2px; }
  .goal-bar { display:flex; height:16px; margin:8px 0 6px; border-radius:8px; overflow:hidden; background:rgba(0,0,0,.1); }
  .goal-bar i { display:block; height:100%; border-right:2px solid var(--white); }
  .goal-bar i:last-child { border-right:0; }
  .goal small { font:700 .75rem var(--display); text-transform:uppercase; letter-spacing:.04em; opacity:.65; }
  /* Reached goals: gold card, glowing shimmering bar, trophy banner. */
  .goal.done { margin-left:-8px; margin-right:-8px; padding:10px 8px 8px; border-radius:20px; background:linear-gradient(135deg,#fff3c4,#f7c948); box-shadow:0 0 0 2px #e0a800, 0 4px 18px rgba(224,168,0,.45); }
  .goal.done .goal-top span { background:var(--ink); color:var(--yellow); padding:3px 10px; border-radius:999px; font-size:1.25rem; }
  .goal.done .goal-bar { position:relative; box-shadow:0 0 10px rgba(224,168,0,.8); background:rgba(0,0,0,.18); }
  .goal.done .goal-bar::after { content:''; position:absolute; inset:0; background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.75) 50%,transparent 70%); transform:translateX(-100%); animation:goal-shine 2.6s ease-in-out infinite; }
  .goal.done small { display:block; opacity:1; font-size:.95rem; font-weight:800; }
  .goal.done small .trophy { display:inline-block; animation:goal-pop .9s ease-out; }
  @keyframes goal-shine { 0%,35% { transform:translateX(-100%); } 100% { transform:translateX(100%); } }
  @keyframes goal-pop { 0% { transform:scale(0) rotate(-30deg); } 60% { transform:scale(1.5) rotate(10deg); } 100% { transform:scale(1) rotate(0); } }
  .confetti { position:fixed; top:-12px; z-index:20; width:9px; height:14px; pointer-events:none; animation:confetti-fall linear forwards; }
  @keyframes confetti-fall { to { transform:translate(var(--dx),105vh) rotate(var(--rot)); opacity:.9; } }
  @media (prefers-reduced-motion:reduce) { .goal.done .goal-bar::after, .goal.done small .trophy { animation:none; } }
  .totals { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; text-align:center; }
  .totals b { display:block; font:800 2.2rem/.95 var(--display); font-variant-numeric:tabular-nums; }
  .totals small { font:700 .8rem var(--display); text-transform:uppercase; letter-spacing:.06em; opacity:.6; }

  .awards { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .badge.award { background:var(--fg); color:var(--bg-c); padding:3px 11px; font-size:.72rem; }
  .more { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; margin-top:12px; min-height:44px; border:0; border-radius:16px; background:var(--tile); color:inherit; font:700 1rem var(--display); text-transform:uppercase; letter-spacing:.06em; cursor:pointer; }
  .more i { font-style:normal; display:inline-block; transition:transform .15s; }
  .open .more i { transform:rotate(180deg); }
  .detail { display:none; margin-top:12px; }
  .open .detail { display:block; }
  .detail h3 { margin:14px 0 8px; font:700 .9rem var(--display); text-transform:uppercase; letter-spacing:.06em; opacity:.75; }
  .detail h3:first-child { margin-top:0; }
  .mrow { display:grid; grid-template-columns:1.25fr repeat(5, 1fr); align-items:center; gap:2px; padding:7px 10px; border-radius:12px; text-align:center; font:800 1.05rem var(--display); font-variant-numeric:tabular-nums; }
  .mrow > :first-child { text-align:left; text-transform:uppercase; letter-spacing:.03em; }
  .mrow.hd { padding-top:0; padding-bottom:0; font:700 .72rem var(--display); text-transform:uppercase; letter-spacing:.05em; opacity:.7; }
  .mrow.cur { background:var(--fg); color:var(--bg-c); }
  .mrow + .mrow:not(.hd) { margin-top:4px; background:var(--tile); }
  .mrow.cur { background:var(--fg) !important; }
  .trends { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  .trend { background:var(--tile); border-radius:16px; padding:10px; }
  .trend small { display:block; font:700 .75rem var(--display); text-transform:uppercase; letter-spacing:.06em; opacity:.75; }
  .trend b { display:block; font:800 1.5rem/1.05 var(--display); }
  .trend svg { display:block; width:100%; height:36px; margin:6px 0 2px; overflow:visible; }
  .trend svg rect { fill:var(--fg); }
  .trend svg polyline { fill:none; stroke:var(--fg); stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; vector-effect:non-scaling-stroke; }
  .trend em { font:700 .78rem var(--display); font-style:normal; letter-spacing:.04em; opacity:.8; }
  .viz { background:var(--white); border-radius:28px; padding:16px 18px; margin-bottom:12px; }
  .viz.dark { background:var(--ink); color:var(--white); }
  .viz.forest { background:#244a3f; color:var(--white); }
  .viz h2 { margin:0 0 10px; font:700 .9rem var(--display); text-transform:uppercase; letter-spacing:.06em; }
  .heat { display:grid; grid-template-columns:76px repeat(30, 1fr); gap:2px; align-items:center; }
  .heat .who { font:700 .85rem var(--display); text-transform:uppercase; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding-right:6px; }
  .heat i { aspect-ratio:1; border-radius:2px; background:var(--ink); }
  .heat-key { display:flex; align-items:center; gap:3px; justify-content:flex-end; margin-top:8px; font:700 .72rem var(--display); text-transform:uppercase; opacity:.7; }
  .heat-key i { width:10px; height:10px; border-radius:2px; background:var(--ink); }
  .kpm { display:grid; grid-template-columns:auto 1fr auto auto; gap:8px 10px; align-items:center; }
  .kpm-row { display:contents; }
  .kpm .who { font:700 .95rem var(--display); text-transform:uppercase; max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .kpm-track { position:relative; height:14px; background:rgba(255,255,255,.12); border-radius:7px; }
  .kpm-track i { position:absolute; inset:0 auto 0 0; border-radius:7px; }
  .kpm-track u { position:absolute; top:-3px; bottom:-3px; width:2px; margin-left:-1px; background:var(--white); }
  .kpm b { font:800 1.2rem var(--display); font-variant-numeric:tabular-nums; }
  .kpm small { font:700 .75rem var(--display); text-transform:uppercase; opacity:.65; white-space:nowrap; }
  .kpm-key { margin-top:10px; font:700 .72rem var(--display); text-transform:uppercase; opacity:.7; }
  .kpm-key u { display:inline-block; width:2px; height:10px; background:var(--white); vertical-align:-1px; margin-right:4px; }
  .scatter svg { display:block; width:100%; height:auto; overflow:visible; }
  .scatter .ax { stroke:rgba(0,0,0,.15); stroke-width:1; }
  .scatter text { font:700 9px var(--display); text-transform:uppercase; letter-spacing:.04em; fill:var(--ink); }
  .scatter text.tick { font-size:8px; opacity:.55; }
  .scatter circle { stroke:var(--ink); stroke-width:1.5; }
  .viz .cap { margin-top:6px; font:700 .72rem var(--display); text-transform:uppercase; opacity:.6; }
  .box svg { display:block; width:100%; height:auto; overflow:visible; }
  .box text { font:700 9px var(--display); text-transform:uppercase; letter-spacing:.04em; fill:var(--white); }
  .box text.tick { font-size:8px; opacity:.55; }
  .box text.na { font-size:8px; opacity:.5; }
  .box .ax { stroke:rgba(255,255,255,.15); stroke-width:1; }
  .box .wh { stroke:var(--white); stroke-width:1.5; }
  .box .med { stroke:var(--ink); stroke-width:2.5; }
  .box .life { stroke:var(--white); stroke-width:2; stroke-dasharray:2 2; }
  .howto { margin-top:12px; padding-top:10px; border-top:1px solid rgba(255,255,255,.18); font-size:.82rem; line-height:1.4; opacity:.9; }
  .howto p { margin:0 0 6px; }
  .howto ul { margin:0 0 6px; padding-left:18px; }
  .howto li { margin-bottom:2px; }
  .note { padding:12px 14px; background:var(--tile); border-radius:12px; font-size:.82rem; }

  @media (min-width:560px) {
    h1 { font-size:4.6rem; }
    .controls { flex-direction:row; flex-wrap:wrap; }
    .controls .seg { flex:1 1 auto; }
    .sortrow { flex:1 0 100%; margin:0; padding:0; }
    .tiles { grid-template-columns:repeat(5, 1fr); }
    .tiles.n4 { grid-template-columns:repeat(4, 1fr); }
    .tile, .tile:nth-child(n+4), .tiles.n4 .tile, .tiles.n4 .tile:nth-child(n+4) { grid-column:auto; }
    .player { padding:22px; }
    .head { gap:12px; }
    .rank { width:42px; height:42px; }
    .name { font-size:1.7rem; }
    .hero b { font-size:4rem; }
  }
</style>
</head>
<body>
<main>
  <h1>Squad Stats</h1>
  <div class="subs"><div class="sub" id="updated">Loading…</div><div class="sub" id="season-end" hidden></div></div>
  <div class="controls">
    <div class="seg" id="view"></div>
    <div class="seg" id="window"></div>
    <div class="seg" id="mode"></div>
    <div class="sortrow" id="sort"></div>
  </div>
  <div class="summary" id="goals" hidden></div>
  <div class="summary" id="summary"></div>
  <div class="viz" id="records" hidden></div>
  <div class="viz" id="activity" hidden></div>
  <div class="viz dark" id="kpm" hidden></div>
  <div class="viz forest" id="box" hidden></div>
  <div class="viz" id="scatter" hidden></div>
  <div class="list" id="list"></div>
</main>
<script>
const WINDOWS = { week: 'This week', season: 'Season', lifetime: 'Lifetime' };
// The stats API doesn't report season dates; they live in season.json.
const SEASON = { start: null, end: null };
const seasonDate = (s) => { const d = s ? new Date(s + 'T00:00:00') : null; return d && !isNaN(d) ? d : null; };
const VIEWS = { board: 'Leaderboard', trends: 'Trends' };
const MODES = { overall: 'Overall', solo: 'Solo', duo: 'Duo', squad: 'Squad' };
const COLS = [
  ['wins', 'Wins', (v) => v],
  ['kills', 'Kills', (v) => v],
  ['kd', 'K/D', (v) => v.toFixed(2)],
  ['winRate', 'Win %', (v) => v.toFixed(1) + '%'],
  ['matches', 'Matches', (v) => v],
  ['level', 'Level', (v) => v ?? '–'],
];
const AWARDS = [['wins', 'Most wins'], ['kills', 'Most kills'], ['kd', 'Best K/D'], ['winRate', 'Top win %'], ['matches', 'Most played']];
const MAX_AWARDS = 3;
const DAY = 864e5;
const TREND_DAYS = 30;

function showSeasonEnd() {
  const el = document.getElementById('season-end');
  const end = SEASON.end, today = new Date(new Date().toDateString());
  if (!end) return;
  const days = Math.round((end - today) / DAY);
  const date = end.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  el.textContent = days < 0 ? `Season ended ${date}`
    : `Season ends ${date} · ${days === 0 ? 'today' : days === 1 ? '1 day left' : days + ' days left'}`;
  el.hidden = false;
}

function ago(ms) {
  const m = Math.round(ms / 6e4);
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  const h = Math.round(m / 60);
  return h < 48 ? h + 'h ago' : Math.round(h / 24) + 'd ago';
}

// updatedAt = numbers last changed; checkedAt = last successful check (recorded at most every 30 min).
function showFreshness() {
  const d = state.data, el = document.getElementById('updated');
  if (!d.updatedAt) { el.textContent = 'Waiting for the first update run.'; return; }
  const checked = Date.parse(d.checkedAt ?? d.updatedAt), changed = Date.parse(d.updatedAt);
  const age = Date.now() - checked;
  el.textContent = `${age < 60 * 6e4 ? 'Checked within the hour' : 'Checked ' + ago(age)} · New stats ${ago(Date.now() - changed)}`;
  el.dataset.tip = `Last checked ${new Date(checked).toLocaleString()}. Numbers last changed ${new Date(changed).toLocaleString()}.`;
}

const state = { goals: [], view: 'board', window: 'season', mode: 'overall', sort: 'wins', data: null, history: {}, open: new Set() };

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const PLATFORM = { epic: 'Epic', psn: 'PlayStation', xbl: 'Xbox' };
const signed = (d, digits = 0) => {
  const r = Number(d.toFixed(digits));
  return (r > 0 ? '+' : r < 0 ? '−' : '') + Math.abs(r).toFixed(digits);
};
const fmtFor = (k) => COLS.find(([c]) => c === k)[2];

// ---- stats ------------------------------------------------------------

// History snapshots hold lifetime totals; older ones only have overall.
const snapMode = (snap, mode) => (mode === 'overall' ? snap : snap.modes?.[mode]);

function weekStats(name, mode) {
  const snaps = (state.history[name] ?? []).filter((s) => snapMode(s, mode));
  if (!snaps.length) return null;
  const cutoff = Date.now() - 7 * DAY;
  // Baseline = latest snapshot at or before the cutoff, else the earliest we have.
  const base = [...snaps].reverse().find((s) => Date.parse(s.t) <= cutoff) ?? snaps[0];
  const cur = snapMode(snaps.at(-1), mode);
  const b = snapMode(base, mode);
  const d = (k) => cur[k] - b[k];
  const matches = d('matches');
  return {
    wins: d('wins'), kills: d('kills'), matches,
    kd: d('deaths') > 0 ? d('kills') / d('deaths') : d('kills'),
    winRate: matches ? (d('wins') / matches) * 100 : 0,
    since: Date.parse(base.t),
  };
}

function statsFor(p, win = state.window, mode = state.mode) {
  const m = win === 'week' ? weekStats(p.name, mode) : p[win]?.[mode];
  return m ? { ...m, level: p.level } : null;
}

function computeAwards(rows) {
  const out = new Map(rows.map(({ p }) => [p.name, []]));
  for (const [k, label] of AWARDS) {
    // K/D and win % are noisy over a handful of matches.
    const minMatches = k === 'kd' || k === 'winRate' ? 5 : 1;
    const elig = rows.filter(({ s }) => s && s.matches >= minMatches);
    if (elig.length < 2) continue;
    const best = Math.max(...elig.map(({ s }) => s[k]));
    if (!(best > 0)) continue;
    for (const { p, s } of elig) if (s[k] === best) out.get(p.name).push(label);
  }
  return out;
}

// Lifetime overall trend over the last TREND_DAYS, from history snapshots.
function trendPoints(name) {
  const snaps = state.history[name] ?? [];
  const cutoff = Date.now() - TREND_DAYS * DAY;
  const inRange = snaps.filter((s) => Date.parse(s.t) >= cutoff);
  const before = snaps.filter((s) => Date.parse(s.t) < cutoff).at(-1);
  return before ? [before, ...inRange] : inRange;
}

// minSpan keeps a ratio like K/D from turning noise into a dramatic line.
function sparkline(vals, times, minSpan = 0) {
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < minSpan) { const mid = (hi + lo) / 2; lo = mid - minSpan / 2; hi = mid + minSpan / 2; }
  const t0 = times[0], span = times.at(-1) - t0 || 1;
  const pts = vals.map((v, i) => {
    const x = ((times[i] - t0) / span) * 100;
    const y = hi === lo ? 18 : 34 - ((v - lo) / (hi - lo)) * 32;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  return `<svg viewBox="0 0 100 36" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts.join(' ')}"/></svg>`;
}

// ---- rendering --------------------------------------------------------

function segment(id, opts, key) {
  const el = document.getElementById(id);
  el.innerHTML = Object.entries(opts).map(([k, label]) =>
    `<button data-k="${k}" class="${state[key] === k ? 'on' : ''}">${label}</button>`).join('');
  el.onclick = (e) => {
    const k = e.target.dataset?.k;
    if (!k) return;
    state[key] = k;
    render();
  };
}

function renderSummary(rows) {
  const el = document.getElementById('summary');
  const have = rows.filter(({ s }) => s);
  el.hidden = !have.length && state.window !== 'week';
  if (!have.length) {
    el.innerHTML = `<h2>${MODES[state.mode]} · This week</h2><div class="note">Weekly numbers for this mode start building from the next update and fill in as you play.</div>`;
    return;
  }
  const sum = (k) => have.reduce((n, { s }) => n + s[k], 0);
  let when = WINDOWS[state.window];
  if (state.window === 'week') {
    const since = Math.min(...have.map(({ s }) => s.since));
    when = since <= Date.now() - 7 * DAY ? 'Last 7 days' : 'Since ' + new Date(since).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }
  el.innerHTML = `<h2>Squad total · ${when} · ${MODES[state.mode]}</h2>
    <div class="totals">${[['wins', 'Wins'], ['kills', 'Kills'], ['matches', 'Matches']].map(([k, label]) =>
      `<div><b>${sum(k).toLocaleString()}</b><small>${label}</small></div>`).join('')}</div>`;
}

function modesTable(p) {
  const head = `<div class="mrow hd"><span></span>${['Wins', 'Kills', 'K/D', 'Win %', 'Games'].map((l) => `<span>${l}</span>`).join('')}</div>`;
  const body = Object.entries(MODES).map(([m, label]) => {
    const s = statsFor(p, state.window, m);
    const cell = (k) => `<span>${s ? fmtFor(k)(s[k]).toString().replace('.0%', '%') : '–'}</span>`;
    return `<div class="mrow ${m === state.mode ? 'cur' : ''}"><span>${label}</span>${['wins', 'kills', 'kd', 'winRate', 'matches'].map(cell).join('')}</div>`;
  }).join('');
  return head + body;
}

// Per-day gains over the window: one entry per day with data, vs the previous day's last snapshot.
function dailyGains(pts) {
  const days = new Map();
  pts.forEach((s) => days.set(new Date(s.t).toLocaleDateString('en-CA'), s));
  const last = [...days.values()];
  return last.slice(1).map((s, i) => ({
    t: Date.parse(s.t),
    day: new Date(s.t).toLocaleDateString('en-CA'),
    matches: s.matches - last[i].matches,
    wins: s.wins - last[i].wins,
    kills: s.kills - last[i].kills,
    deaths: s.deaths - last[i].deaths,
  }));
}

function bars(vals) {
  const max = Math.max(...vals, 1), w = 100 / vals.length;
  const rects = vals.map((v, i) => {
    const h = Math.max((v / max) * 34, v > 0 ? 1.5 : 0.6);
    return `<rect x="${(i * w + w * 0.15).toFixed(2)}" y="${(36 - h).toFixed(2)}" width="${(w * 0.7).toFixed(2)}" height="${h.toFixed(2)}" rx="0.6"/>`;
  });
  return `<svg viewBox="0 0 100 36" preserveAspectRatio="none" aria-hidden="true">${rects.join('')}</svg>`;
}

function trends(p) {
  const pts = trendPoints(p.name);
  const days = pts.length >= 2 ? dailyGains(pts) : [];
  if (!days.length) return '<div class="note">Trends show up once there are a few more days on record.</div>';
  const sum = (k) => days.reduce((n, d) => n + d[k], 0);
  const kd = (k, d) => (d ? k / d : k);
  const dayKd = days.filter((d) => d.deaths > 0);
  const tile = (label, big, chart, sub) =>
    `<div class="trend"><small>${label}</small><b>${big}</b>${chart}<em>${sub}</em></div>`;
  const latest = pts.at(-1);
  return `<div class="trends">
    ${tile('Wins', sum('wins').toLocaleString(), bars(days.map((d) => d.wins)), 'per day')}
    ${tile('Kills', sum('kills').toLocaleString(), bars(days.map((d) => d.kills)), 'per day')}
    ${tile('K/D', kd(sum('kills'), sum('deaths')).toFixed(2),
      dayKd.length > 1 ? sparkline(dayKd.map((d) => d.kills / d.deaths), dayKd.map((d) => d.t), 1) : '<svg></svg>',
      'daily · ' + kd(latest.kills, latest.deaths).toFixed(2) + ' lifetime')}
  </div>`;
}

const PLAYER_COLORS = ['#f6806a', '#f7c948', '#7470f4', '#5fc9e8', '#f58fc2'];
const heatLevel = (v, max) => (v > 0 ? Math.ceil((v / max) * 4) : 0);
const heatAlpha = [0.08, 0.3, 0.5, 0.75, 1];

// One row per player, one square per day, shaded by matches played that day.
function renderActivity() {
  const el = document.getElementById('activity');
  const keys = Array.from({ length: TREND_DAYS }, (_, i) =>
    new Date(Date.now() - (TREND_DAYS - 1 - i) * DAY).toLocaleDateString('en-CA'));
  const rows = state.data.players.map((p) => {
    const pts = trendPoints(p.name);
    const byDay = new Map((pts.length >= 2 ? dailyGains(pts) : []).map((d) => [d.day, d.matches]));
    return { name: p.name, vals: keys.map((k) => byDay.get(k) ?? 0) };
  });
  const max = Math.max(...rows.flatMap((r) => r.vals), 0);
  el.hidden = !max;
  if (!max) return;
  el.innerHTML = `<h2>Activity · last ${TREND_DAYS} days</h2><div class="heat">${rows.map((r) =>
    `<span class="who" data-tip="${esc(r.name)}">${esc(r.name)}</span>${r.vals.map((v, i) =>
      `<i style="opacity:${heatAlpha[heatLevel(v, max)]}" data-tip="${esc(r.name)} · ${keys[i]} · ${v} matches"></i>`).join('')}`).join('')}</div>
    <div class="heat-key">Less ${heatAlpha.map((a) => `<i style="opacity:${a}"></i>`).join('')} More</div>`;
}

// Kills per match over the window, vs each player's lifetime average (the tick).
function renderKpm() {
  const el = document.getElementById('kpm');
  const rows = state.data.players.map((p, i) => {
    const pts = trendPoints(p.name);
    if (pts.length < 2) return null;
    const first = pts[0], last = pts.at(-1), matches = last.matches - first.matches;
    if (matches <= 0) return null;
    return { name: p.name, color: PLAYER_COLORS[i % PLAYER_COLORS.length], matches,
      kpm: (last.kills - first.kills) / matches, life: last.kills / last.matches };
  }).filter(Boolean).sort((a, b) => b.kpm - a.kpm);
  el.hidden = !rows.length;
  if (!rows.length) return;
  const top = Math.max(...rows.flatMap((r) => [r.kpm, r.life]));
  const pct = (v) => ((v / top) * 100).toFixed(1);
  el.innerHTML = `<h2>Kills per match · last ${TREND_DAYS} days</h2><div class="kpm">${rows.map((r) =>
    `<div class="kpm-row"><span class="who" data-tip="${esc(r.name)}">${esc(r.name)}</span>
      <div class="kpm-track" data-tip="${esc(r.name)} · ${r.kpm.toFixed(2)} lately · ${r.life.toFixed(2)} lifetime"><i style="width:${pct(r.kpm)}%;background:${r.color}"></i><u style="left:${pct(r.life)}%"></u></div>
      <b>${r.kpm.toFixed(2)}</b><small>${r.matches} games</small></div>`).join('')}</div>
    <div class="kpm-key"><u></u> Lifetime average</div>`;
}

// Season win % vs K/D, one dot per player, sized by matches played.
function renderScatter() {
  const el = document.getElementById('scatter');
  const dots = state.data.players.map((p, i) => {
    const s = statsFor(p, 'season', 'overall');
    return s && s.matches ? { name: p.name, x: s.winRate, y: s.kd, m: s.matches, color: PLAYER_COLORS[i % PLAYER_COLORS.length] } : null;
  }).filter(Boolean);
  el.hidden = dots.length < 2;
  if (el.hidden) return;
  const W = 300, H = 200, L = 34, B = 28, T = 8, R = 16;
  const lo = (k, pad) => Math.floor((Math.min(...dots.map((d) => d[k])) - pad)), hi = (k, pad) => Math.ceil(Math.max(...dots.map((d) => d[k])) + pad);
  const x0 = lo('x', 1), x1 = hi('x', 1), y0 = Math.max(0, Math.floor((Math.min(...dots.map((d) => d.y)) - 0.2) * 2) / 2), y1 = Math.ceil((Math.max(...dots.map((d) => d.y)) + 0.2) * 2) / 2;
  const X = (v) => L + ((v - x0) / (x1 - x0)) * (W - L - R), Y = (v) => H - B - ((v - y0) / (y1 - y0)) * (H - B - T);
  const maxM = Math.max(...dots.map((d) => d.m));
  const xt = [x0, (x0 + x1) / 2, x1], yt = [y0, (y0 + y1) / 2, y1];
  el.innerHTML = `<h2>Win % vs K/D · season</h2><div class="scatter"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Win rate versus K/D per player">
    ${xt.map((v) => `<line class="ax" x1="${X(v)}" x2="${X(v)}" y1="${T}" y2="${H - B}"/><text class="tick" x="${X(v)}" y="${H - B + 11}" text-anchor="middle">${v.toFixed(0)}%</text>`).join('')}
    ${yt.map((v) => `<line class="ax" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="tick" x="${L - 4}" y="${Y(v) + 3}" text-anchor="end">${v.toFixed(1)}</text>`).join('')}
    <text x="${(L + W - R) / 2}" y="${H - 2}" text-anchor="middle">Win % →</text>
    <text transform="translate(7 ${(T + H - B) / 2}) rotate(-90)" text-anchor="middle">K/D →</text>
    ${dots.map((d, i) => {
      const cx = X(d.x), cy = Y(d.y), r = 4 + Math.sqrt(d.m / maxM) * 7;
      const crowded = dots.slice(0, i).some((o) => Math.hypot(X(o.x) - cx, Y(o.y) - cy) < 22);
      const left = cx > W - L - R - 30;
      const tx = crowded ? cx : left ? cx - r - 3 : cx + r + 3;
      const ty = crowded ? cy + r + 10 : cy + 3;
      const anchor = crowded ? 'middle' : left ? 'end' : 'start';
      return `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r.toFixed(1)}" fill="${d.color}" fill-opacity=".85" data-tip="${esc(d.name)} · ${d.x.toFixed(1)}% · ${d.y.toFixed(2)} K/D · ${d.m} matches"/>
      <text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="${anchor}">${esc(d.name)}</text>`;
    }).join('')}
  </svg></div><div class="cap">Up = better K/D · Right = wins more · Bigger dot = more matches</div>`;
}

// Spread of daily kills per match: the box is the middle half of days, the line a typical day.
const quantile = (sorted, q) => {
  const i = (sorted.length - 1) * q, lo = Math.floor(i);
  return sorted[lo] + (sorted[Math.min(lo + 1, sorted.length - 1)] - sorted[lo]) * (i - lo);
};
const BOX_MIN_DAYS = 5, BOX_MIN_MATCHES = 3;

function renderBox() {
  const el = document.getElementById('box');
  const rows = state.data.players.map((p, i) => {
    const pts = trendPoints(p.name);
    const days = (pts.length >= 2 ? dailyGains(pts) : []).filter((d) => d.matches >= BOX_MIN_MATCHES).map((d) => d.kills / d.matches).sort((a, b) => a - b);
    const last = pts.at(-1);
    const base = { name: p.name, color: PLAYER_COLORS[i % PLAYER_COLORS.length], n: days.length };
    if (days.length < BOX_MIN_DAYS) return base;
    return { ...base, min: days[0], q1: quantile(days, 0.25), med: quantile(days, 0.5), q3: quantile(days, 0.75), max: days.at(-1), life: last.kills / last.matches };
  });
  const ready = rows.filter((r) => r.med !== undefined);
  el.hidden = !ready.length;
  if (!ready.length) return;
  ready.sort((a, b) => b.med - a.med);
  const ordered = [...ready, ...rows.filter((r) => r.med === undefined)];
  const top = Math.ceil(Math.max(...ready.flatMap((r) => [r.max, r.life])));
  const W = 300, L = 78, R = 10, ROW = 26, T = 6, H = T + ordered.length * ROW + 16;
  const X = (v) => L + (v / top) * (W - L - R);
  const ticks = Array.from({ length: top + 1 }, (_, i) => i);
  el.innerHTML = `<h2>Consistency · daily kills per match</h2><div class="box"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Spread of daily kills per match per player">
    ${ticks.map((v) => `<line class="ax" x1="${X(v)}" x2="${X(v)}" y1="${T}" y2="${H - 14}"/><text class="tick" x="${X(v)}" y="${H - 3}" text-anchor="middle">${v}</text>`).join('')}
    ${ordered.map((r, i) => {
      const cy = T + i * ROW + ROW / 2;
      const name = `<text x="0" y="${cy + 3}">${esc(r.name.length > 12 ? r.name.slice(0, 11) + '…' : r.name)}</text>`;
      if (r.med === undefined) return `${name}<text class="na" x="${L + 4}" y="${cy + 3}">${r.n} of ${BOX_MIN_DAYS} days needed</text>`;
      return `${name}<g data-tip="${esc(r.name)} · median ${r.med.toFixed(2)} · middle half ${r.q1.toFixed(2)}–${r.q3.toFixed(2)} · range ${r.min.toFixed(2)}–${r.max.toFixed(2)} · ${r.n} days"><rect x="${L}" y="${cy - 12}" width="${W - L - R}" height="24" fill="transparent"/>
        <line class="wh" x1="${X(r.min)}" x2="${X(r.max)}" y1="${cy}" y2="${cy}"/>
        <line class="wh" x1="${X(r.min)}" x2="${X(r.min)}" y1="${cy - 4}" y2="${cy + 4}"/><line class="wh" x1="${X(r.max)}" x2="${X(r.max)}" y1="${cy - 4}" y2="${cy + 4}"/>
        <rect x="${X(r.q1)}" y="${cy - 8}" width="${Math.max(X(r.q3) - X(r.q1), 2)}" height="16" rx="3" fill="${r.color}"/>
        <line class="med" x1="${X(r.med)}" x2="${X(r.med)}" y1="${cy - 8}" y2="${cy + 8}"/>
        <line class="life" x1="${X(r.life)}" x2="${X(r.life)}" y1="${cy - 11}" y2="${cy + 11}"/></g>`;
    }).join('')}
  </svg></div><div class="howto"><p>Each row shows how a player's individual days stack up, so you can tell steady from streaky.</p><ul>
    <li><b>Colored box</b> – their middle half of days. A short box means consistent, a wide one means it swings.</li>
    <li><b>Black line</b> – a typical day (the median).</li>
    <li><b>Whiskers</b> – their worst and best day.</li>
    <li><b>Dashed line</b> – their lifetime average. Box sitting right of it means they're playing better than usual lately.</li></ul>
    <p>Only days with ${BOX_MIN_MATCHES}+ matches count, and a player needs ${BOX_MIN_DAYS} such days to appear.</p></div>`;
}

// Squad goals: season totals summed across everyone, from goals.json.
function renderGoals(rows) {
  const el = document.getElementById('goals');
  el.hidden = !state.goals.length;
  if (el.hidden) return;
  const end = SEASON.end, start = SEASON.start, today = new Date(new Date().toDateString());
  const daysLeft = end ? Math.round((end - today) / DAY) : -1;
  // Fraction of the season elapsed, counting today as in progress.
  const elapsed = end && start ? Math.min(1, Math.max(0, (today - start) / DAY + 1) / Math.max(1, Math.round((end - start) / DAY) + 1)) : 0;
  const tracking = !!end && !!start && daysLeft >= 0 && end > start;
  el.innerHTML = '<h2>Squad goals</h2>' + state.goals.map((g) => {
    // Colour by current rank so segments match the player cards below.
    const parts = rows.map(({ p }, i) => ({ name: p.name, v: p.season?.[g.mode ?? 'overall']?.[g.metric] ?? 0, color: PLAYER_COLORS[ci(p.name)] }));
    const total = parts.reduce((a, x) => a + x.v, 0);
    const pct = Math.min(100, (total / g.target) * 100);
    const expected = tracking ? Math.round(g.target * elapsed) : null;
    const diff = expected === null ? 0 : total - expected;
    const pace = expected === null || total >= g.target ? ''
      : ` · ${Math.abs(diff) < 1 ? 'on pace' : diff > 0 ? diff.toLocaleString() + ' ahead' : Math.abs(diff).toLocaleString() + ' behind'} (target ${expected.toLocaleString()})`;
    const note = total >= g.target ? `<span class="trophy">🏆</span> Goal crushed${total > g.target ? ` · ${(total - g.target).toLocaleString()} over` : ''} 🎉`
      : `${(g.target - total).toLocaleString()} to go${daysLeft > 0 ? ` · ${daysLeft} days left` : ''}${pace}`;
    return `<div class="goal${total >= g.target ? ' done' : ''}" data-goal="${esc(g.metric + ':' + g.target)}">
      <div class="goal-top"><b>${esc(g.label)}</b><span>${total.toLocaleString()} / ${g.target.toLocaleString()}</span></div>
      <div class="goal-track"><div class="goal-bar" role="img" aria-label="${pct.toFixed(0)}% of goal">${parts.filter((x) => x.v > 0).map((x) =>
        `<i style="width:${(x.v / g.target) * 100}%;background:${x.color}" data-tip="${esc(x.name)}: ${x.v}"></i>`).join('')}</div>
      ${expected === null || total >= g.target ? '' : `<u class="goal-pace" style="left:${elapsed * 100}%" data-tip="Where you should be today: ${expected.toLocaleString()}"></u>`}</div>
      <small>${note}</small></div>`;
  }).join('');
  // Celebrate each newly reached goal once per browser, not on every re-render.
  const fresh = [...el.querySelectorAll('.goal.done')].filter((d) => {
    const key = 'goalCelebrated:' + d.dataset.goal;
    try { if (localStorage.getItem(key)) return false; localStorage.setItem(key, '1'); } catch {}
    return true;
  });
  if (fresh.length) confetti();
}

function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors = [PLAYER_COLORS, ['#f7c948', '#f6806a', '#7470f4', '#5fc9e8', '#f58fc2']].flat();
  for (let i = 0; i < 120; i++) {
    const c = document.createElement('i');
    c.className = 'confetti';
    c.style.cssText = `left:${Math.random() * 100}vw;background:${colors[i % colors.length]};--dx:${(Math.random() - .5) * 240}px;--rot:${Math.random() * 1080 - 540}deg;animation-duration:${2.2 + Math.random() * 2}s;animation-delay:${Math.random() * .6}s;border-radius:${i % 3 ? '2px' : '50%'}`;
    document.body.appendChild(c);
    c.addEventListener('animationend', () => c.remove());
  }
}

// Records and streaks across all recorded history, from daily gains.
const dayLabel = (k) => new Date(k + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
const dayNum = (k) => Date.parse(k + 'T00:00:00Z') / DAY;

// Longest and latest run of consecutive calendar days in a sorted list of YYYY-MM-DD keys.
function dayRuns(keys) {
  let best = null, cur = null;
  for (const k of keys) {
    cur = cur && dayNum(k) - dayNum(cur.end) === 1 ? { ...cur, end: k, len: cur.len + 1 } : { start: k, end: k, len: 1 };
    if (!best || cur.len > best.len) best = cur;
  }
  return { best, cur };
}

function computeRecords() {
  const yest = new Date(Date.now() - DAY).toLocaleDateString('en-CA');
  const recs = {}, rolls = [];
  const consider = (key, v, who, when, live = false) => {
    if (v > 0 && (!recs[key] || v > recs[key].v)) recs[key] = { v, ...who, when, live };
  };
  for (const p of state.data.players) {
    const days = dailyGains(state.history[p.name] ?? []).filter((d) => d.matches > 0);
    const who = { name: p.name, color: PLAYER_COLORS[ci(p.name)] };
    for (const d of days) {
      const when = dayLabel(d.day);
      consider('kills', d.kills, who, when);
      consider('wins', d.wins, who, when);
      consider('matches', d.matches, who, when);
      if (d.matches >= 5) consider('kpm', d.kills / d.matches, who, when);
    }
    for (const [key, keys] of [['play', days.map((d) => d.day)], ['win', days.filter((d) => d.wins > 0).map((d) => d.day)]]) {
      const { best, cur } = dayRuns(keys);
      if (!best) continue;
      const when = best.len > 1 ? `${dayLabel(best.start)} – ${dayLabel(best.end)}` : dayLabel(best.start);
      consider(key, best.len, who, when, best.end === cur.end && cur.end >= yest);
      if (key === 'play' && cur.end >= yest && cur.len >= 2) rolls.push({ ...who, len: cur.len });
    }
  }
  return { recs, rolls: rolls.sort((a, b) => b.len - a.len) };
}

function renderRecords() {
  const el = document.getElementById('records');
  const { recs, rolls } = computeRecords();
  const defs = [
    ['kills', 'Most kills in a day'], ['wins', 'Most wins in a day'], ['matches', 'Most matches in a day'],
    ['kpm', 'Best day · kills per match (5+ games)', (v) => v.toFixed(2)],
    ['play', 'Longest play streak · days in a row'], ['win', 'Longest win streak · days in a row with a win'],
  ].filter(([k]) => recs[k]);
  el.hidden = !defs.length;
  if (el.hidden) return;
  el.innerHTML = `<h2>Records &amp; streaks</h2>${defs.map(([k, label, fmt = (v) => v]) => {
    const r = recs[k];
    return `<div class="rec"><div class="rec-v">${fmt(r.v)}</div><div class="rec-l"><b>${label}</b>
      <span><i class="dot" style="background:${r.color}"></i>${esc(r.name)} · ${r.when}${r.live ? ' <em class="badge live">Active</em>' : ''}</span></div></div>`;
  }).join('')}
    ${rolls.length ? `<h3>Playing streaks right now</h3><div class="rolls">${rolls.map((r) =>
      `<span class="badge"><i class="dot" style="background:${r.color}"></i>${esc(r.name)} · ${r.len} days</span>`).join('')}</div>` : ''}
    <p class="fine">Counted from stat snapshots, so a "day" is when stats were recorded. The stats API only reports totals, so game-by-game win streaks can't be tracked.</p>`;
}

const isActive = (s) => !!s && s.matches > 0;

// Players with nothing to rank in the current view get a slim row instead of a card of zeros.
function idleRow(p) {
  const when = { week: 'this week', season: 'this season', lifetime: 'yet' }[state.window];
  const mode = state.mode === 'overall' ? '' : MODES[state.mode].toLowerCase() + ' ';
  const msg = p.error && !p.season ? 'No data yet' : `No ${mode}matches ${when}`;
  return `<article class="player idle c${ci(p.name)}" data-name="${esc(p.name)}">
    <div class="name">${esc(p.name)}</div>
    ${p.error ? `<span class="badge err" data-tip="${esc('Could not refresh, showing last known stats · ' + p.error)}">stale</span>` : ''}
    <div class="idle-msg">${msg}</div></article>`;
}

function render() {
  hideTip();
  segment('view', VIEWS, 'view');
  const trendsView = state.view === 'trends';
  for (const id of ['window', 'mode', 'sort', 'summary', 'list']) document.getElementById(id).hidden = trendsView;
  if (trendsView) document.getElementById('goals').hidden = true;
  if (trendsView) { renderRecords(); renderActivity(); renderKpm(); renderBox(); renderScatter(); return; }
  document.getElementById('records').hidden = document.getElementById('activity').hidden = document.getElementById('kpm').hidden = document.getElementById('scatter').hidden = document.getElementById('box').hidden = true;
  segment('window', WINDOWS, 'window');
  segment('mode', MODES, 'mode');

  const sort = document.getElementById('sort');
  // Level is the current season's battle pass level, so it means nothing for lifetime stats.
  const cols = state.window === 'lifetime' ? COLS.filter(([k]) => k !== 'level') : COLS;
  if (!cols.some(([k]) => k === state.sort)) state.sort = 'wins';
  sort.innerHTML = '<span>Rank by</span>' + cols.map(([k, label]) =>
    `<button class="chip ${state.sort === k ? 'on' : ''}" data-k="${k}">${label}</button>`).join('');
  sort.onclick = (e) => { if (e.target.dataset?.k) { state.sort = e.target.dataset.k; render(); } };

  const rows = state.data.players
    .map((p) => ({ p, s: statsFor(p) }))
    .sort((a, b) => (isActive(b.s) - isActive(a.s)) || ((b.s?.[state.sort] ?? -1) - (a.s?.[state.sort] ?? -1)));

  renderGoals(rows);
  renderSummary(rows);
  const list = document.getElementById('list');
  if (!rows.length) { list.innerHTML = '<div class="empty">No players yet. Add some to players.json.</div>'; return; }

  const [, sortLabel, sortFmt] = cols.find(([k]) => k === state.sort);
  const max = Math.max(...rows.filter(({ s }) => isActive(s)).map(({ s }) => s[state.sort] ?? 0), 0);
  const tiles = cols.filter(([k]) => k !== state.sort);
  const awards = computeAwards(rows);

  let rank = 0;
  list.innerHTML = rows.map(({ p, s }) => {
    if (!isActive(s)) return idleRow(p);
    rank++;
    const mine = awards.get(p.name);
    const shown = mine.slice(0, MAX_AWARDS);
    const extra = mine.slice(MAX_AWARDS);
    const open = state.open.has(p.name);
    return `
    <article class="player c${ci(p.name)} ${open ? 'open' : ''}" data-name="${esc(p.name)}">
      <div class="head">
        <div class="rank">${rank}</div>
        <div class="who">
          <div class="name">${esc(p.name)}</div>
          <div class="meta">
            <span class="badge">${PLATFORM[p.accountType] ?? esc(p.accountType)}</span>
            ${p.error ? `<span class="badge err" data-tip="${esc('Could not refresh, showing last known stats · ' + p.error)}">stale</span>` : ''}
          </div>
        </div>
        <div class="hero"><b>${s ? sortFmt(s[state.sort]) : '–'}</b><small>${sortLabel}</small></div>
      </div>
      ${mine.length ? `<div class="awards">${shown.map((a) => `<span class="badge award">★ ${a}</span>`).join('')}${extra.length ? `<span class="badge award" data-tip="${esc(extra.join(', '))}">+${extra.length}</span>` : ''}</div>` : ''}
      <div class="bar"><i style="width:${max && s ? Math.max(2, (s[state.sort] / max) * 100) : 0}%"></i></div>
      <div class="tiles ${tiles.length === 4 ? 'n4' : ''}">${tiles.map(([k, label, fmt]) =>
        `<div class="tile"><b>${s ? fmt(s[k]) : '–'}</b><small>${label}</small></div>`).join('')}</div>
      <button class="more" aria-expanded="${open}">Details <i>▾</i></button>
      <div class="detail">
        <h3>By mode · ${WINDOWS[state.window]}</h3>
        ${modesTable(p)}
        <h3>Last ${TREND_DAYS} days</h3>
        ${trends(p)}
      </div>
    </article>`;
  }).join('');
}

// Toggle details in place so the page doesn't re-render (and jump).
document.getElementById('list').addEventListener('click', (e) => {
  const btn = e.target.closest('.more');
  if (!btn) return;
  const card = btn.closest('.player');
  const open = card.classList.toggle('open');
  btn.setAttribute('aria-expanded', open);
  state.open[open ? 'add' : 'delete'](card.dataset.name);
});

// Tooltips: hover on desktop, tap on touch screens (title attributes don't work on phones).
const tipEl = document.createElement('div');
tipEl.id = 'tip'; tipEl.hidden = true; tipEl.setAttribute('role', 'tooltip');
document.body.append(tipEl);
let tipTarget = null;
function hideTip() { tipTarget = null; tipEl.hidden = true; }
function showTip(t) {
  tipTarget = t;
  tipEl.textContent = t.dataset.tip;
  tipEl.style.left = tipEl.style.top = '0px';
  tipEl.hidden = false;
  const r = t.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  tipEl.style.left = Math.max(8, Math.min(r.left + r.width / 2 - w / 2, innerWidth - w - 8)) + 'px';
  tipEl.style.top = (r.top - h - 8 >= 8 ? r.top - h - 8 : r.bottom + 8) + 'px';
}
const canHover = matchMedia('(hover: hover)').matches;
document.addEventListener(canHover ? 'mouseover' : 'click', (e) => {
  const t = e.target.closest?.('[data-tip]');
  if (!t || (!canHover && t === tipTarget)) return hideTip();
  showTip(t);
});
document.addEventListener('mouseout', (e) => { if (!e.relatedTarget) hideTip(); });
addEventListener('scroll', hideTip, { passive: true });
addEventListener('keydown', (e) => { if (e.key === 'Escape') hideTip(); });

// Each player keeps one colour across the whole page, by their place in players.json.
const ci = (name) => Math.max(0, state.data.players.findIndex((p) => p.name === name)) % PLAYER_COLORS.length;

Promise.all([
  fetch('data/stats.json').then((r) => r.json()),
  fetch('data/history.json').then((r) => r.json()).catch(() => ({})),
  fetch('goals.json').then((r) => r.json()).catch(() => []),
  fetch('season.json').then((r) => r.json()).catch(() => ({})),
]).then(([data, history, goals, season]) => {
  state.data = data;
  state.goals = goals;
  state.history = history;
  SEASON.start = seasonDate(season.start);
  SEASON.end = seasonDate(season.end);
  showFreshness();
  setInterval(showFreshness, 6e4);
  showSeasonEnd();
  render();
}).catch(() => { document.getElementById('updated').textContent = 'Could not load stats.'; });
</script>
</body>
</html>
